name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate pages, metadata, landmarks and links
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: node --check assets/js/main.js
